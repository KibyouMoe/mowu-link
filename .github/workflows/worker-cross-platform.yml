name: Worker Mac and Windows

on:
  push:
    paths: ["worker/**", "server/router/**", ".github/workflows/worker-cross-platform.yml"]
  pull_request:
    paths: ["worker/**", "server/router/**", ".github/workflows/worker-cross-platform.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [22, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Shared business parity and both Worker suites
        shell: bash
        env:
          CODEXWORKER_TEST_PYTHON: python
        run: node worker/check-compat.mjs --workers-only
      - name: Router real HTTP and SQLite selftest
        if: runner.os == 'macOS'
        shell: bash
        env:
          ROUTER_TEST_PORT: "18790"
        run: python server/router/selftest_router.py

# These native OS runners cover real paths, permissions, IPC and child shutdown.
# Tests requiring an actual interactive Desktop owner stay explicitly skipped;
# CI is not proof of real Desktop restart or Feishu end-to-end acceptance.
