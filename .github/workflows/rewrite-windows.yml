name: Rewrite Windows installation

on:
  push:
    branches: [feat/rewrite-formal-mainline]
    paths: ["rewrite/**", "!rewrite/**/*.md", "!rewrite/evidence/**", ".github/workflows/rewrite-windows.yml"]

permissions:
  contents: read

concurrency:
  group: rewrite-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Test pinned packages on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
            $env:PATH = "$(Join-Path $gitRoot 'mingw64\bin');$(Join-Path $gitRoot 'usr\bin');$env:PATH"
          }
          openssl version
          python -c "import platform, sys; assert sys.platform == 'win32'; print(platform.platform(), sys.version)"
          $dir = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP ('mowulink-' + [Guid]::NewGuid().ToString('N')))
          try {
            $owner = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $acl = Get-Acl -LiteralPath $dir.FullName
            $acl.SetSecurityDescriptorSddlForm("D:P(A;OICI;FA;;;SY)(A;OICI;FA;;;$owner)", [Security.AccessControl.AccessControlSections]::Access)
            Set-Acl -LiteralPath $dir.FullName -AclObject $acl
            $acl = Get-Acl -LiteralPath $dir.FullName
            $rules = @($acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]))
            if (-not $acl.AreAccessRulesProtected -or $rules.Count -ne 2 -or ($rules | Where-Object {
              $_.IdentityReference.Value -notin @($owner, 'S-1-5-18')
            })) {
              throw "Expected a private test directory (protected=$($acl.AreAccessRulesProtected), rules=$($rules.Count))"
            }
            Write-Output 'Temporary test ACL verified'
            $state = New-Item -ItemType Directory (Join-Path $dir.FullName '状态 试用')
            $env:TMP = $state.FullName
            $env:TEMP = $state.FullName
            $archive = Join-Path $dir.FullName 'archive'
            $installed = Join-Path $dir.FullName 'installed'
            $release = python -B -m rewrite.release build --repository . --revision $env:GITHUB_SHA --destination $archive | ConvertFrom-Json
            python -B -m rewrite.release install --archive $release.archive --revision $release.revision --sha256 $release.sha256 --destination $installed
            $native = New-Item -ItemType Directory (Join-Path $dir.FullName 'codex')
            $package = Join-Path $dir.FullName 'codex-native.tar.gz'
            $url = 'https://github.com/openai/codex/releases/download/rust-v0.171.0-alpha.13.2/codex-package-x86_64-pc-windows-msvc.tar.gz'
            curl.exe --fail --location --silent --show-error --max-time 120 --output $package $url
            if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash -ine '6d3be3ea2e3f759f77f23b543ee882aae6433dc6a6cd260788c2e8793d616eac') {
              throw 'Codex package checksum mismatch'
            }
            tar.exe -xzf $package -C $native.FullName
            $env:MOWULINK_TEST_CODEX_BINARY = Join-Path $native.FullName 'bin\codex.exe'
            & $env:MOWULINK_TEST_CODEX_BINARY --version
            $env:MOWULINK_TEST_CODEX_EVIDENCE = Join-Path $dir.FullName 'native-codex.jsonl'
            $env:MOWULINK_TEST_WINDOWS_SCM = '1'
            $env:MOWULINK_WINDOWS_MAINTENANCE_EVIDENCE = Join-Path $dir.FullName 'windows-scm.json'
            $env:MOWULINK_WINDOWS_ROUTER_RELEASE_EVIDENCE = Join-Path $dir.FullName 'windows-scm-release.json'
            Push-Location -LiteralPath $installed
            try {
              if (-not (Get-Command node -ErrorAction SilentlyContinue)) { throw 'Node required for workspace engine regression' }
              $tests = @(
                'rewrite.test_service.Service.test_daemon_rejects_second_writer_and_cold_restart_recovers_same_state'
                'rewrite.test_service.Service.test_cli_tls_restart_preserves_identity_file_and_receipts'
                'rewrite.test_service.Service.test_three_process_worker_chat_and_assignment'
                'rewrite.test_service.Service.test_windows_public_config_rejected'
                'rewrite.test_host_ops.HostOpsState'
                'rewrite.test_host_ops_windows.WindowsMaintenance'
                'rewrite.test_state_bundle.Bundle.test_trigger_audit_distinguishes_outbox_from_lost_receipt_and_reads_recovered_t04'
                'rewrite.test_state_bundle.Bundle.test_trigger_audit_rejects_individually_valid_but_inconsistent_ledgers'
                'rewrite.test_state_bundle.Bundle.test_handoff_reconciles_feishu_receipts_even_when_display_prefix_matches'
                'rewrite.test_state_bundle.Bundle.test_prepare_worker_chat_archive_after_both_receipts_recover'
                'rewrite.test_state_bundle.Bundle.test_offline_handoff_and_rollback_reserve_the_codex_workspace_writer'
                'rewrite.test_state_bundle.Bundle.test_workspace_audit_checks_private_file_and_original_journal_identity'
                'rewrite.test_workspace_engine.WindowsWorkspaceEngine'
                'rewrite.test_peers.Peers.test_original_reply_link_and_formal_isolation'
                'rewrite.test_feeds.Sources.test_game_real_stream_reconnect_source_replay_and_new_epoch'
                'rewrite.test_feeds.Sources.test_archive_failure_cannot_advance_cursor_and_stale_reader_cannot_skip_event'
                'rewrite.test_codex_rpc.WindowsCodexRpc'
                'rewrite.test_codex_app_server.CodexAppServer.test_codex_adapter_process_handles_native_report_without_controller_dispatch'
                'rewrite.test_codex_app_server.CodexAppServer.test_native_app_server_reconnect_recovers_input_before_w04_without_new_model_call'
                'rewrite.test_codex_app_server.CodexAppServer.test_router_cancel_interrupts_bound_app_server_turn_and_preserves_unrelated_turn'
                'rewrite.test_codex_app_server.CodexAppServer.test_windows_native_readonly_assignment_cleanup_cancel_and_transfer'
              )
              python -B -m unittest -v @tests
              $nativeEvidence = Get-Content -LiteralPath $env:MOWULINK_TEST_CODEX_EVIDENCE
              if ($nativeEvidence.Count -ne 4) { throw 'Windows App Server evidence is incomplete' }
              $nativeEvidence
              Write-Output 'MOWULINK_SCM_EVIDENCE_BEGIN'
              Get-Content -Raw -LiteralPath $env:MOWULINK_WINDOWS_MAINTENANCE_EVIDENCE
              Write-Output 'MOWULINK_SCM_EVIDENCE_END'
              Write-Output 'MOWULINK_SCM_RELEASE_EVIDENCE_BEGIN'
              Get-Content -Raw -LiteralPath $env:MOWULINK_WINDOWS_ROUTER_RELEASE_EVIDENCE
              Write-Output 'MOWULINK_SCM_RELEASE_EVIDENCE_END'
            } finally {
              Pop-Location
            }
            python -B -m rewrite.release verify --archive $release.archive --revision $release.revision --sha256 $release.sha256 --destination $installed
            python -B -m rewrite.release_check --repository . --component worker-pair --previous 307a8a119c6a97ea2cb816280227afb3295e5675 --new $env:GITHUB_SHA
            python -B -m rewrite.release_check --repository . --component router --previous 307a8a119c6a97ea2cb816280227afb3295e5675 --new $env:GITHUB_SHA
            python -B -m rewrite.release_check --repository . --component state-bundle --previous 35ba22f66e3017a1756b8645f3b88d091b3ff6f8 --new $env:GITHUB_SHA
            python -B -m rewrite.release_check --repository . --component assignment-rollout --previous 6e96d976207b7c5f96ba309e199ac4486834e78b --new $env:GITHUB_SHA
          } finally {
            Remove-Item -LiteralPath $dir.FullName -Recurse -Force
          }

  dsh-native:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Read default Docker engine for workspace acceptance
        shell: pwsh
        run: |
          @'
          import shutil, subprocess

          docker = shutil.which("docker.exe")
          engine = "unavailable"
          if docker:
              try:
                  result = subprocess.run([docker, "--context", "default", "info", "--format", "{{.OSType}}"],
                                          capture_output=True, text=True, timeout=10)
                  if result.returncode == 0 and result.stdout.strip() in {"linux", "windows"}:
                      engine = result.stdout.strip()
              except subprocess.TimeoutExpired:
                  engine = "unconfirmed"
          print(f"Default Docker engine for workspace acceptance: {engine}")
          '@ | python -B -
      - name: Verify and run the packaged Windows DSH SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
            $env:PATH = "$(Join-Path $gitRoot 'mingw64\bin');$(Join-Path $gitRoot 'usr\bin');$env:PATH"
          }
          $dir = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP ('mowulink-dsh-' + [Guid]::NewGuid().ToString('N')))
          try {
            $owner = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $acl = Get-Acl -LiteralPath $dir.FullName
            $acl.SetSecurityDescriptorSddlForm("D:P(A;OICI;FA;;;SY)(A;OICI;FA;;;$owner)", [Security.AccessControl.AccessControlSections]::Access)
            Set-Acl -LiteralPath $dir.FullName -AclObject $acl
            $download = Join-Path $dir.FullName 'dsh-installer.exe'
            $url = 'https://download.deepseek.com/dsh-desk/bin/win-x64/deepseek-harness-0.2.2-rc.5-win-x64.exe'
            curl.exe --fail --location --silent --show-error --max-time 180 --output $download $url
            $hash = [Convert]::FromHexString((Get-FileHash -LiteralPath $download -Algorithm SHA512).Hash)
            if ([Convert]::ToBase64String($hash) -cne 'wWySRp7Hk5gcH324jBxAc7KV0mniHzQDofyQexOJMIAWXBkgHTsRCr3IrdwX1XO8OIhDZsLYmve4mLxskikYIg==') {
              throw 'DSH installer checksum mismatch'
            }
            Write-Output 'Verified DeepSeek Windows DSH 0.2.2-rc.5 installer'
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
            $payload = Join-Path $dir.FullName 'payload'
            & $sevenZip x -y -bso0 "-o$payload" $download
            $nested = @(Get-ChildItem -LiteralPath $payload -Filter app-64.7z -File -Recurse)
            if ($nested.Count -eq 1) {
              $payload = Join-Path $dir.FullName 'app'
              & $sevenZip x -y -bso0 "-o$payload" $nested[0].FullName
            }
            $bundles = @(Get-ChildItem -LiteralPath $payload -Filter app.asar -File -Recurse)
            if ($bundles.Count -ne 1) { throw 'Expected one packaged DSH app.asar' }
            $executables = @(Get-ChildItem -LiteralPath $bundles[0].Directory.Parent.FullName -Filter '*.exe' -File |
              Where-Object { $_.BaseName -match '^DeepSeek[ -]Harness$' })
            if ($executables.Count -ne 1) { throw 'Expected one packaged DSH executable' }
            $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
            $gitBash = Join-Path $gitRoot 'bin'
            if (-not (Test-Path -LiteralPath (Join-Path $gitBash 'bash.exe') -PathType Leaf)) { throw 'Git Bash missing' }
            $env:PATH = "$gitBash;$env:PATH"
            $env:MOWULINK_TEST_DSH_BINARY = $executables[0].FullName
            $env:MOWULINK_TEST_DSH_EVIDENCE = Join-Path $dir.FullName 'native-dsh.json'
            $env:MOWULINK_TEST_DSH_MEDIA_EVIDENCE = Join-Path $dir.FullName 'native-dsh-media.json'
            $env:MOWULINK_TEST_DSH_MEDIA_PROCESS_EVIDENCE = Join-Path $dir.FullName 'native-dsh-media-process.json'
            $env:MOWULINK_DSH_MANAGED_EVIDENCE = Join-Path $dir.FullName 'native-dsh-managed.json'
            $env:MOWULINK_DSH_CLEANUP_EVIDENCE = Join-Path $dir.FullName 'native-dsh-cleanup.json'
            $env:MOWULINK_DSH_CLEANUP_REFUSAL_EVIDENCE = Join-Path $dir.FullName 'native-dsh-cleanup-refusal.json'
            $env:MOWULINK_DSH_FOREGROUND_TLS_EVIDENCE = Join-Path $dir.FullName 'native-dsh-questions.json'
            $env:MOWULINK_DSH_APPROVAL_TLS_EVIDENCE = Join-Path $dir.FullName 'native-dsh-approval.json'
            $env:MOWULINK_DSH_GOAL_TLS_EVIDENCE = Join-Path $dir.FullName 'native-dsh-goal.json'
            $env:MOWULINK_DSH_COMPACT_TLS_EVIDENCE = Join-Path $dir.FullName 'native-dsh-compact.json'
            $env:MOWULINK_DSH_WINDOWS_WORKSPACE_EVIDENCE = Join-Path $dir.FullName 'native-dsh-workspace.json'
            $state = New-Item -ItemType Directory (Join-Path $dir.FullName '状态 试用')
            $env:TMP = $state.FullName
            $env:TEMP = $state.FullName
            $archive = Join-Path $dir.FullName 'archive'
            $installed = Join-Path $dir.FullName 'installed'
            $release = python -B -m rewrite.release build --repository . --revision $env:GITHUB_SHA --destination $archive | ConvertFrom-Json
            python -B -m rewrite.release install --archive $release.archive --revision $release.revision --sha256 $release.sha256 --destination $installed
            Push-Location -LiteralPath $installed
            try {
              python -B -m unittest -v rewrite.test_dsh_native_loop.LocalTlsLoop
            } finally {
              Pop-Location
            }
            python -B -m rewrite.release verify --archive $release.archive --revision $release.revision --sha256 $release.sha256 --destination $installed
            Get-Content -Raw -LiteralPath $env:MOWULINK_TEST_DSH_EVIDENCE
            Get-Content -Raw -LiteralPath $env:MOWULINK_TEST_DSH_MEDIA_EVIDENCE
            Get-Content -Raw -LiteralPath $env:MOWULINK_TEST_DSH_MEDIA_PROCESS_EVIDENCE
            Get-Content -Raw -LiteralPath $env:MOWULINK_DSH_MANAGED_EVIDENCE
            Get-Content -Raw -LiteralPath $env:MOWULINK_DSH_CLEANUP_EVIDENCE
            Get-Content -Raw -LiteralPath $env:MOWULINK_DSH_CLEANUP_REFUSAL_EVIDENCE
            Get-Content -Raw -LiteralPath $env:MOWULINK_DSH_FOREGROUND_TLS_EVIDENCE
            Get-Content -Raw -LiteralPath $env:MOWULINK_DSH_APPROVAL_TLS_EVIDENCE
            Get-Content -Raw -LiteralPath $env:MOWULINK_DSH_GOAL_TLS_EVIDENCE
            Get-Content -Raw -LiteralPath $env:MOWULINK_DSH_COMPACT_TLS_EVIDENCE
            Write-Output 'MOWULINK_DSH_WORKSPACE_EVIDENCE_BEGIN'
            Get-Content -Raw -LiteralPath $env:MOWULINK_DSH_WINDOWS_WORKSPACE_EVIDENCE
            Write-Output 'MOWULINK_DSH_WORKSPACE_EVIDENCE_END'
          } finally {
            Remove-Item -LiteralPath $dir.FullName -Recurse -Force
          }
