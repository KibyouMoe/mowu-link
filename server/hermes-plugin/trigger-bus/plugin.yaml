name: trigger-bus
version: 0.9.2
description: "Pull unread events from the local mowu-trigger service (127.0.0.1:8791) and deliver them without waiting for the trainer to speak. Level alone decides the mode: event = interrupt (internal=false handle_message: a running turn is interrupted at once, an idle session starts a turn), notify = queue (never interrupts; 0.9.0 never parks it in the adapter's pending slot, which is what made a busy-time notify open a new turn and kill a running tool: busy => adapter.handle_message(internal=true) so Hermes' OWN busy queue commits it as a durable admission (session authority -> admit_native) and its FIFO runs it only after the current turn finished, with a plugin-side held queue as fallback when no session authority exists; idle => enqueued then the head is processed with adapter.get_pending_message + handle_message). Delivery is only proven when pre_llm_call injects those cards into the turn's context (or transform_tool_result inserts one mid-turn); queued, in-flight, refused and timed-out batches never advance the cursor or ACK, they stay in an in-memory ledger and are retried at least once (TRIGGER_BUS_BATCH_TTL). Same event_id is never enqueued twice. Routing key comes from the pre_gateway_dispatch session source, falling back to session_id (logged which). Every seam renders the same two-line card: '#<id> <level> <source>/<actor> HH:MM [thr=<thread_key>]' then '> <text clipped to 100 chars>'; the wake message itself is one line only — '⚡ 来自 <source> · <actor> 的打断' for event, '📬 收到来自 <source> · <actor> 的 Notify 消息' for notify — with NO cards and NO MessageEvent.metadata (the gateway session envelope refuses any non-native metadata with invalid_params (metadata) and silently dropped the interrupted message); the batch stays in the local queue and the turn the wake starts injects those cards through pre_llm_call, which is also the delivery proof and the only place the cursor/ACK move; a batch gets '[N 条]' on top, expands at most 5 cards and ends with '+K more'; mid-turn insertion is prefixed '⚡ 立刻处理：'. 0.8.2: 一条 event 只走一条路 (one event takes exactly one route) — an event already claimed by a wake is never inserted by transform_tool_result (woken_ids), and an event already inserted mid-turn is never woken; a failed/refused wake releases the claim so the mid-turn insert still works as fallback. info/log are never injected. 0.8.3: an event wake additionally sends one short Chinese line of its own through the adapter's send entry (send_message / send / _send_text / _send_plain_message, probed by name) to the source chat_id — '⚡ 收到来自 <source> · <actor> 的 Event 消息' — once per wake, naming the first event (notify wakes sent nothing extra until 0.8.5); the send is best-effort (every failure is only logged) and never affects the wake. 0.8.4: the Chinese line is sent immediately after handle_message (no sleep, no call_later, no delay knob) and a second in-process guard drops an identical (chat, text) sent within 2 s — capacity 32, oldest dropped, a failed send releases its entry — so a re-entrant wake or a duplicate scheduler still produces exactly one line; a coroutine send rides the gateway loop captured in pre_gateway_dispatch, and with no usable loop it runs synchronously on the calling thread (logged). 0.8.5: the notice is level-aware and shared — a notify wake now sends '📬 收到来自 <source> · <actor> 的 Notify 消息' through the same immediate, deduped, best-effort send, while event keeps '⚡ 收到来自 <source> · <actor> 的 Event 消息' byte-for-byte; the texts differ, so the (chat, text) dedupe key never collides across levels; still exactly one visible notice per wake — a tick that merges both levels names the merged batch's first event and its level picks the text; info/log send nothing; wake text, internal flags, queueing, cursor/ACK and cards are untouched. 0.9.1: notify 的可见通知只在真正送达时发，排队不发 — the 📬 line is sent by the delivery proof itself (pre_llm_call injecting the batch into the turn, the exact decision point that logs DELIVERED and moves the cursor/ACK), and never at enqueue: NATIVE-QUEUED and HELD are silent, so 忙时入队不再提前说“收到”; one 📬 per batch, naming its first source, and a batch confirmed twice still speaks once; event is unchanged (wake-time hard interrupt + immediate ⚡ 收到来自 <source> · <actor> 的 Event 消息); the 2 s (chat, text) dedupe, its 32-entry cap, the queueing routes and the cursor rule are untouched; info/log send nothing. 0.9.2: 忙时多条 notify 合并为一次唤醒 — the FIRST notify of a busy window still opens the one turn (native admission via handle_message->admit_native, or a plugin-side HELD batch when no session authority exists), but every later notify is accumulated in the plugin (journal `notify MERGED`) and merged into that same delivery instead of calling handle_message/admit_native again, so three busy notifies produce ONE wake and ONE batched injection (one `[N 条]` card, cursor once to the maximum id); the visible notice is one `📬` line PER event of the batch, capped at 3 lines — X<=3 verbatim, X>3 shows 3 lines with the 3rd ending `…x(X-2)` (X=100 -> `…x98`) — sent as one message and deduped on the whole text; a held window whose cards were already injected by another turn is retired without an empty wake. event hard interrupt (one immediate ⚡), idle notify, the 2 s same-text dedupe and the one-line wake texts are unchanged. Failures degrade silently; disable with TRIGGER_BUS_DISABLED=1."
author: "mowu"
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - transform_tool_result
  - pre_gateway_dispatch
