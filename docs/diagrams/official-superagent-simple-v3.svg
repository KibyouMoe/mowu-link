<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="960" viewBox="0 0 1560 960" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>

  <rect width="1560" height="960" fill="#f8fafc"/>
  <text x="56" y="58" font-size="26" font-weight="700" fill="#0f172a">官方 Super Agent · 极简版</text>
  <text x="56" y="86" font-size="14" fill="#64748b">左边一条线跑数据，右边一块做判断，中间只有三个箭头。</text>

  <!-- ======================= 左：数据流 ======================= -->
  <text x="120" y="128" font-size="14" font-weight="700" fill="#334155">数据流</text>

  <rect x="120" y="144" width="440" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="142" y="174" font-size="15" font-weight="700" fill="#0f172a">Sources 消息源</text>
  <text x="142" y="200" font-size="13" fill="#475569">GitHub / 邮箱 / 群聊 · 全是轮询</text>
  <text x="142" y="220" font-size="12" fill="#94a3b8">产出一条 Trigger（带 event_id 去重）</text>

  <line x1="340" y1="230" x2="340" y2="258" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="120" y="262" width="440" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="142" y="292" font-size="15" font-weight="700" fill="#0f172a">三级过滤</text>
  <text x="142" y="318" font-size="13" fill="#475569">L1 听不听（纯配置）· L2 够不够格（确定性）</text>
  <text x="142" y="338" font-size="12" fill="#94a3b8">L3 只有 inferred 才调模型 —— 「老板 @ 我」零开销</text>

  <line x1="340" y1="348" x2="340" y2="376" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="120" y="380" width="440" height="98" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" filter="url(#sh)"/>
  <text x="142" y="410" font-size="15" font-weight="700" fill="#065f46">Thread 话题</text>
  <text x="142" y="434" font-size="13" fill="#475569">subscriptions：谁跟着这个话题（能干活）</text>
  <text x="142" y="454" font-size="13" fill="#475569">context：只听不授权　pending：去抖</text>
  <text x="142" y="472" font-size="12" fill="#94a3b8">作用：后续消息自动认领，不用模型再判</text>

  <line x1="340" y1="478" x2="340" y2="506" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="120" y="510" width="440" height="86" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" filter="url(#sh)"/>
  <text x="142" y="540" font-size="15" font-weight="700" fill="#065f46">Ticket 工单 + Mandate</text>
  <text x="142" y="566" font-size="13" fill="#475569">不可变授权 · 一单一个工作目录 · 一单一个会话</text>

  <line x1="340" y1="596" x2="340" y2="624" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="120" y="628" width="440" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
  <text x="142" y="656" font-size="15" font-weight="700" fill="#0f172a">Assignment 派发</text>
  <text x="142" y="680" font-size="13" fill="#475569">lease 防重复派 · 并发槽 · 派发快照</text>

  <line x1="340" y1="706" x2="340" y2="734" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="120" y="738" width="440" height="96" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" filter="url(#sh)"/>
  <text x="142" y="768" font-size="15" font-weight="700" fill="#065f46">Worker 会话</text>
  <text x="142" y="792" font-size="13" fill="#475569">worker-&lt;ticketId&gt; · 读写全开 · 独立目录</text>
  <text x="142" y="814" font-size="12" fill="#94a3b8">产出 report：progress / ready / blocked / failed</text>

  <!-- ======================= 右：Router ======================= -->
  <text x="760" y="128" font-size="14" font-weight="700" fill="#334155">Router（横在上面做判断，不碰数据）</text>

  <rect x="760" y="144" width="740" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#sh)"/>
  <text x="784" y="174" font-size="15" font-weight="700" fill="#1e3a8a">① 评估</text>
  <text x="784" y="200" font-size="13" fill="#334155">拿候选卡片：原文 + 这个话题已有的单</text>
  <text x="784" y="222" font-size="13" fill="#334155">explicit 不评估直接下单；只有 inferred 才起模型</text>
  <text x="784" y="244" font-size="12" fill="#94a3b8">工具：orchestrator_eval / orchestrator_read</text>

  <!-- Router 内部：评估 → 决定 -->
  <line x1="1080" y1="266" x2="1080" y2="326" stroke="#dc2626" stroke-width="2.6" marker-end="url(#ar)"/>
  <rect x="1094" y="282" width="128" height="26" rx="13" fill="#fef2f2" stroke="#fecaca"/>
  <text x="1108" y="300" font-size="12.5" fill="#b91c1c">评估结果 → 决定</text>

  <rect x="760" y="330" width="740" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#sh)"/>
  <text x="784" y="360" font-size="15" font-weight="700" fill="#1e3a8a">② 决定去向</text>
  <text x="784" y="386" font-size="13" fill="#334155">accept 建新单 · attach 挂到已有单</text>
  <text x="784" y="408" font-size="13" fill="#334155">ignore 忽略 · stop 停掉</text>
  <text x="784" y="430" font-size="12" fill="#94a3b8">工具：orchestrator_route</text>

  <rect x="760" y="520" width="740" height="120" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="784" y="550" font-size="15" font-weight="700" fill="#334155">物理约束（不是靠自觉）</text>
  <text x="784" y="576" font-size="13" fill="#475569">文件系统 write:false / edit:false　无 web　无 subagent</text>
  <text x="784" y="598" font-size="13" fill="#475569">禁 sleep；等超 30 秒直接拒绝 —— 派完必须结束这一轮</text>
  <text x="784" y="620" font-size="12" fill="#94a3b8">所以它没法自己动手，只能派人</text>

  <rect x="760" y="710" width="740" height="124" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" filter="url(#sh)"/>
  <text x="784" y="740" font-size="15" font-weight="700" fill="#78350f">③ 收报告 / 转述给人</text>
  <text x="784" y="766" font-size="13" fill="#334155">progress 无问题 → 静默（不打扰人）</text>
  <text x="784" y="788" font-size="13" fill="#334155">ready / blocked → 转述到发起这个任务的那个对话里</text>
  <text x="784" y="812" font-size="12" fill="#94a3b8">工具：orchestrator_report / orchestrator_reply</text>

  <!-- ======================= 三个箭头 ======================= -->
  <!-- Thread → Router 评估 -->
  <path d="M560 428 L758 210" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#ab)"/>
  <rect x="596" y="286" width="150" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="610" y="304" font-size="12.5" fill="#1d4ed8">① 候选卡片</text>

  <!-- Router → Ticket -->
  <path d="M758 392 L562 548" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#ab)"/>
  <rect x="600" y="466" width="180" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="614" y="484" font-size="12.5" fill="#1d4ed8">② accept / attach</text>

  <!-- Worker → Report -->
  <path d="M560 792 L640 792 L640 772 L756 772" stroke="#b45309" stroke-width="2.4" fill="none" marker-end="url(#ao)"/>
  <rect x="470" y="856" width="240" height="26" rx="13" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="486" y="874" font-size="12.5" fill="#b45309">③ report 回到 Router</text>

  <text x="56" y="930" font-size="12.5" fill="#94a3b8">三句话：消息从左边往下流；Router 只在两个点介入（给候选、下决定）；报告不走回头路，只回 Router，由它决定说不说。</text>
</svg>
